# ADN-FRN-Server – Projektdaten für scripts/n8-admin.sh (Update, Berechtigungen, sudo, Dienste)
N8_ID=frnadn
N8_NAME="ADN-FRN-Server"
N8_MAIN_UNIT=frnadn.service
# Dienste in der Übersicht (Admin → System → Dienste): Unit|Bezeichnung|erlaubte Aktionen (leer = alle)
N8_UNITS=("frnadn.service|Dashboard (frnadn)" "frn-server.service|Java-FRN-Server" "frnadn-update.path|Update-Auslöser („Update jetzt“)")
N8_GROUPS=(systemd-journal adm)
N8_RESTART_UNITS=(frn-server.service frnadn.service)

n8_layout() {
    local d j
    d="$(grep -h '^Environment=FRNADN_DATA=' /etc/systemd/system/frnadn.service 2>/dev/null | head -1 | cut -d= -f3- || true)"
    DATA="${d:-/var/lib/frnadn}"
    j="$(grep -h '^Environment=FRNADN_FRN_JAR=' /etc/systemd/system/frnadn.service 2>/dev/null | head -1 | cut -d= -f3- || true)"
    FRN_DIR="$(dirname "${j:-/opt/frn-server/FRN_Server.jar}")"
    N8_DATA_DIRS=("$DATA")
    # FRN_Server.jar wird aus dem Adminbereich aktualisiert (läuft als frnadn, nie als root)
    N8_EXTRA_OWNED=("$FRN_DIR")
    N8_SECRETS=("$DATA/frnadn.db $DATA/frnadn.db-wal $DATA/frnadn.db-shm|600" "$DATA/backups/*.frnbak|600")
    local port; port="$(grep -h '^Environment=FRNADN_PORT=' /etc/systemd/system/frnadn.service 2>/dev/null | head -1 | cut -d= -f3- || true)"
    N8_HEALTH_URL="http://127.0.0.1:${port:-8080}/api/info"
    # Keep-Alive: Dashboard antwortet, Java-FRN-Server läuft und nimmt Stationen an (nach einem Internet-Ausfall neu anmelden)
    local frnport
    frnport="$(sed -n 's/^server_port=//p' "$FRN_DIR/server.properties" 2>/dev/null | head -1 | tr -dc 0-9 || true)"
    N8_KA_CHECKS=("frnadn.service|http|http://127.0.0.1:${port:-8080}/api/info|Dashboard (frnadn)"
                  "frn-server.service|health|http://127.0.0.1:${port:-8080}/api/n8/health#frn|Java-FRN-Server"
                  "frn-server.service|tcp|127.0.0.1:${frnport:-10024}|FRN-Port ${frnport:-10024} (Stationen)")
    N8_KA_NET_UNITS=(frn-server.service)
}
n8_version() { sed -n 's/^__version__ = "\(.*\)"/\1/p' "$APP/frnadn/__init__.py"; }
# ---------------------------------------------------------------- Systempakete (bei jedem Update und bei „Korrigieren“)
# Was install.sh installiert, wird bei jedem Update geprüft und fehlende Pakete werden nachinstalliert – z. B. certbot für
# HTTPS mit Let's Encrypt, Java für den FRN-Server. apt wartet höchstens 2 Minuten auf eine laufende Paketinstallation.
N8_APT_PKGS=(python3 python3-venv python3-pip sudo curl unzip ca-certificates certbot)
n8_missing_pkgs() {
    local p out=""
    command -v dpkg-query >/dev/null || return 0
    for p in "${N8_APT_PKGS[@]}"; do
        dpkg-query -W -f='${Status}' "$p" 2>/dev/null | grep -q "ok installed" || out="$out $p"
    done
    command -v java >/dev/null || out="$out default-jre-headless"
    echo "${out# }"
}
n8_install_deps() {
    local miss
    miss="$(n8_missing_pkgs)"
    if [[ -z "$miss" ]]; then
        info "Systempakete vollständig: certbot $(certbot --version 2>&1 | awk '{print $2}'), $(java -version 2>&1 | grep -v '^Picked up' | head -1 | tr -d '"'), Python $(python3 -c 'import sys; print("%d.%d" % sys.version_info[:2])' 2>/dev/null)"
        return 0
    fi
    if ! command -v apt-get >/dev/null; then warn "Fehlende Systempakete: $miss – bitte von Hand installieren (kein apt)"; return 0; fi
    info "Fehlende Systempakete werden nachinstalliert: $miss"
    export DEBIAN_FRONTEND=noninteractive
    timeout 600 apt-get update -qq >/dev/null 2>&1 || warn "apt-get update mit Fehler – versuche es trotzdem"
    # shellcheck disable=SC2086
    if timeout 1200 apt-get install -y -q --no-install-recommends -o DPkg::Lock::Timeout=120 $miss >/dev/null 2>&1; then
        info "Nachinstalliert: $miss"
    else
        warn "Nachinstallieren fehlgeschlagen: $miss – auf der Konsole: sudo apt-get install $miss"
    fi
    return 0
}
n8_check_extra() {   # Admin → System → Berechtigungen & sudo: fehlende Systempakete
    local miss p
    miss="$(n8_missing_pkgs)"
    for p in $miss; do
        case "$p" in
            certbot) ck bad prog "certbot fehlt – HTTPS mit Let's Encrypt geht nicht (Korrigieren installiert es)" ;;
            default-jre-headless) ck bad prog "Java fehlt – der FRN-Server startet nicht (Korrigieren installiert default-jre-headless)" ;;
            *) ck bad prog "Systempaket $p fehlt (Korrigieren installiert es)" ;;
        esac
    done
    [[ -z "$miss" ]] && ck ok prog "Systempakete vollständig (certbot, Java, Python, curl, unzip …)"
    return 0
}
n8_fix_extra() { n8_install_deps; }

n8_post_update() {   # nach dem Vorspulen: Systempakete, Python-Pakete, Konfiguration des FRN-Servers, alte Reste
    n8_install_deps
    "$APP/venv/bin/pip" install -q -r "$APP/requirements.txt" || return 1
    install -d -m 700 -o "$SVC_USER" -g "$SVC_USER" "$DATA/backups"
    command -v frnadn >/dev/null && frnadn write-config >/dev/null 2>&1 || true
    # bis 2.12: N8 update guard als ExecStartPre und eigene sudo-Datei – beides macht jetzt n8-admin.sh
    if grep -q "n8-update-guard" /etc/systemd/system/frnadn.service 2>/dev/null; then
        sed -i '/n8-update-guard/d' /etc/systemd/system/frnadn.service; systemctl daemon-reload || true
    fi
    rm -f /etc/sudoers.d/frnadn
    return 0
}
n8_sudo_extra() {   # wie bisher: FRN-Server aus dem Adminbereich, Neustart/Ausschalten der Maschine (nur Superadmin)
    local SC="$1"
    echo "$SVC_USER ALL=(root) NOPASSWD: $SC start frn-server.service"
    echo "$SVC_USER ALL=(root) NOPASSWD: $SC stop frn-server.service"
    echo "$SVC_USER ALL=(root) NOPASSWD: $SC restart frn-server.service"
    echo "$SVC_USER ALL=(root) NOPASSWD: $SC reboot"
    echo "$SVC_USER ALL=(root) NOPASSWD: $SC poweroff"
}
