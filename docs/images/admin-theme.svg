<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="940" viewBox="0 0 1360 940" role="img" aria-labelledby="t d">
<title id="t">Schematische Theme-Verwaltung im Admin-Portal</title><desc id="d">Theme-Tab mit Farbschema, vier frei wählbaren Farben und separatem Upload für Dashboard-Logo und Browser-Site-Icon.</desc>
<defs><style>
.bg{fill:#0b1224}.shell{fill:#182239;stroke:#ffffff24}.tile{fill:#1c2740;stroke:#ffffff2c}.box{fill:#202d49;stroke:#ffffff25}.field{fill:#101a2e;stroke:#ffffff30}.txt{font:15px system-ui,sans-serif;fill:#f5f7fb}.dim{font:12px system-ui,sans-serif;fill:#aebbd0}.title{font:bold 22px system-ui,sans-serif;fill:#f5f7fb}.head{font:bold 15px system-ui,sans-serif;fill:#f5f7fb}.lbl{font:12px system-ui,sans-serif;fill:#aebbd0}.tab{font:12px system-ui,sans-serif;fill:#bdc8da}.active{fill:#18384e;stroke:#5ac8fa88}.btn{fill:#5ac8fa}.btnt{font:bold 13px system-ui,sans-serif;fill:#102033}.sw{stroke:#ffffff66;stroke-width:1}.round{rx:12}
</style></defs>
