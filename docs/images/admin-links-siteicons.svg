<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="900" viewBox="0 0 1360 900" role="img" aria-labelledby="t d">
<title id="t">Schematische Linkverwaltung mit Website-Site-Icons</title><desc id="d">Link-Tab mit darstellungsoptionen, sortierbaren Einträgen, Favicon-Vorschau, Site-Icon-Schalter, Emoji-Fallback und Refresh-Aktion.</desc>
<defs><style>
.bg{fill:#0b1224}.shell{fill:#182239;stroke:#ffffff24}.tile{fill:#1c2740;stroke:#ffffff2c}.box{fill:#202d49;stroke:#ffffff25}.field{fill:#101a2e;stroke:#ffffff30}.txt{font:15px system-ui,sans-serif;fill:#f5f7fb}.dim{font:12px system-ui,sans-serif;fill:#aebbd0}.title{font:bold 22px system-ui,sans-serif;fill:#f5f7fb}.head{font:bold 15px system-ui,sans-serif;fill:#f5f7fb}.lbl{font:12px system-ui,sans-serif;fill:#aebbd0}.tab{font:12px system-ui,sans-serif;fill:#bdc8da}.active{fill:#18384e;stroke:#5ac8fa88}.btn{fill:#5ac8fa}.btnt{font:bold 13px system-ui,sans-serif;fill:#102033}.mutedbtn{fill:#2a3855}.badge{fill:#5ac8fa}
</style></defs>
<rect class="bg" width="1360" height="900"/><rect class="shell" x="18" y="18" width="1324" height="864" rx="20"/>
<text class="title" x="48" y="63">⚙ Admin portal</text>
<g transform="translate(40 88)"><rect class="box" width="1280" height="48" rx="22"/><text class="tab" x="22" y="30">Settings</text><text class="tab" x="145" y="30">Rooms</text><text class="tab" x="260" y="30">Server lists</text><text class="tab" x="420" y="30">FRN accounts</text><text class="tab" x="590" y="30">Users</text><text class="tab" x="700" y="30">System</text><text class="tab" x="812" y="30">Theme</text><rect class="active" x="900" y="6" width="102" height="36" rx="18"/><text class="txt" x="918" y="30">🔗 Links</text><text class="tab" x="1030" y="30">Import</text><text class="tab" x="1120" y="30">Logs</text></g>
<rect class="tile" x="40" y="160" width="1280" height="690" rx="20"/>
<text class="title" x="68" y="205">🔗 Link menu</text><text class="dim" x="68" y="232">Your own links in the header. Website favicons are fetched securely and cached in SQLite.</text>
<g transform="translate(68 260)"><text class="lbl" x="0" y="14">☑ Show the link menu</text><text class="lbl" x="310" y="14">Menu button text</text><rect class="field" x="310" y="25" width="250" height="42" rx="9"/><text class="txt" x="328" y="52">🔗 Links</text><text class="lbl" x="600" y="14">Display</text><rect class="field" x="600" y="25" width="300" height="42" rx="9"/><text class="txt" x="618" y="52">Button with drop-down menu ▾</text></g>
<text class="head" x="70" y="370">Links <tspan class="dim">(order = order in the menu)</tspan></text>
<!-- rows -->
<g transform="translate(68 392)">
<g><rect class="box" width="1228" height="82" rx="12"/><rect class="field" x="12" y="16" width="56" height="50" rx="9"/><text class="txt" x="28" y="47">🌐</text><rect class="field" x="78" y="16" width="235" height="50" rx="9"/><text class="txt" x="94" y="47">ADN website</text><rect class="field" x="323" y="16" width="385" height="50" rx="9"/><text class="txt" x="339" y="47">https://example.org</text><text class="lbl" x="728" y="47">☑ site icon</text><rect x="811" y="29" width="26" height="26" rx="5" fill="#eef4f9"/><circle cx="824" cy="42" r="8" fill="#2189bd"/><text class="lbl" x="853" y="47">☑ new tab</text><g transform="translate(1023 20)"><rect class="mutedbtn" width="42" height="42" rx="20"/><text class="txt" x="14" y="27">↑</text><rect class="mutedbtn" x="48" width="42" height="42" rx="20"/><text class="txt" x="62" y="27">↓</text><rect x="96" width="42" height="42" rx="20" fill="#602d3a"/><text class="txt" x="111" y="27">×</text></g></g>
<g transform="translate(0 94)"><rect class="box" width="1228" height="82" rx="12"/><rect class="field" x="12" y="16" width="56" height="50" rx="9"/><text class="txt" x="28" y="47">💬</text><rect class="field" x="78" y="16" width="235" height="50" rx="9"/><text class="txt" x="94" y="47">Community chat</text><rect class="field" x="323" y="16" width="385" height="50" rx="9"/><text class="txt" x="339" y="47">https://chat.example.net</text><text class="lbl" x="728" y="47">☑ site icon</text><rect x="811" y="29" width="26" height="26" rx="5" fill="#f5f5f5"/><path d="M817 37h14v10h-8l-4 4v-4h-2z" fill="#6748ae"/><text class="lbl" x="853" y="47">☑ new tab</text><g transform="translate(1023 20)"><rect class="mutedbtn" width="42" height="42" rx="20"/><text class="txt" x="14" y="27">↑</text><rect class="mutedbtn" x="48" width="42" height="42" rx="20"/><text class="txt" x="62" y="27">↓</text><rect x="96" width="42" height="42" rx="20" fill="#602d3a"/><text class="txt" x="111" y="27">×</text></g></g>
<g transform="translate(0 188)"><rect class="box" width="1228" height="82" rx="12"/><rect class="field" x="12" y="16" width="56" height="50" rx="9"/><text class="txt" x="28" y="47">📇</text><rect class="field" x="78" y="16" width="235" height="50" rx="9"/><text class="txt" x="94" y="47">Stations</text><rect class="field" x="323" y="16" width="385" height="50" rx="9"/><text class="txt" x="339" y="47">#stations</text><text class="lbl" x="728" y="47">☑ site icon</text><text class="dim" x="815" y="47">fallback emoji</text><text class="lbl" x="948" y="47">☐ new tab</text><g transform="translate(1023 20)"><rect class="mutedbtn" width="42" height="42" rx="20"/><text class="txt" x="14" y="27">↑</text><rect class="mutedbtn" x="48" width="42" height="42" rx="20"/><text class="txt" x="62" y="27">↓</text><rect x="96" width="42" height="42" rx="20" fill="#602d3a"/><text class="txt" x="111" y="27">×</text></g></g>
</g>
<rect class="mutedbtn" x="68" y="704" width="134" height="42" rx="21"/><text class="txt" x="91" y="730">＋ Add link</text><rect class="mutedbtn" x="218" y="704" width="270" height="42" rx="21"/><text class="txt" x="239" y="730">↻ Save &amp; refresh site icons</text><rect class="btn" x="1130" y="704" width="166" height="42" rx="21"/><text class="btnt" x="1161" y="730">💾 Save links</text>
<text class="dim" x="68" y="798">Icons are stored in SQLite. If a site has no favicon, the fallback emoji is shown.</text><text class="dim" x="68" y="830">Schematische Vorschau mit Beispieldaten</text>
