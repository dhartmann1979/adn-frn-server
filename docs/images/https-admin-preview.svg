<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081225"/><stop offset="1" stop-color="#18213a"/></linearGradient></defs><rect width="1200" height="720" rx="22" fill="url(#bg)"/>
<rect x="25" y="20" width="1150" height="70" rx="16" fill="#17243d" stroke="#40506e"/><text x="55" y="64" font-family="Arial" font-size="25" font-weight="bold" fill="#fff">⚙ Admin · Settings</text>
<rect x="25" y="108" width="220" height="580" rx="16" fill="#111d33" stroke="#334765"/><g font-family="Arial" font-size="16" fill="#b9c8dc"><text x="52" y="155">🛰 FRN server</text><text x="52" y="202">🌐 SystemManager</text><text x="52" y="249">👤 Operator</text><text x="52" y="296">🖥 Dashboard</text><text x="52" y="343">🗄 Data</text><rect x="38" y="364" width="194" height="47" rx="10" fill="#1d4263"/><text x="52" y="394" fill="#fff">🔒 HTTPS &amp; web</text></g>
<rect x="265" y="108" width="910" height="580" rx="16" fill="#111d33" stroke="#334765"/>
<text x="300" y="158" font-family="Arial" font-size="24" font-weight="bold" fill="#fff">🔒 HTTPS &amp; Let's Encrypt</text><text x="300" y="188" font-family="Arial" font-size="14" fill="#a9b8d0">Automatic certificate issuance, HTTP → HTTPS redirect and renewal.</text>
<rect x="300" y="218" width="840" height="82" rx="12" fill="#19372f" stroke="#397c61"/><text x="326" y="252" font-family="Arial" font-size="17" font-weight="bold" fill="#a8efc4">Enable HTTPS with Let's Encrypt</text><text x="326" y="278" font-family="Arial" font-size="13" fill="#b7d5c7">Requires public DNS and inbound TCP ports 80 and 443.</text><rect x="1060" y="241" width="52" height="28" rx="14" fill="#27865b"/><circle cx="1097" cy="255" r="10" fill="#fff"/>
<g font-family="Arial"><text x="300" y="344" font-size="14" fill="#c4d2e5">Public domain</text><rect x="300" y="357" width="400" height="47" rx="9" fill="#0c172a" stroke="#40506e"/><text x="320" y="387" font-size="16" fill="#fff">dashboard.example.org</text><text x="730" y="344" font-size="14" fill="#c4d2e5">Certificate e-mail</text><rect x="730" y="357" width="410" height="47" rx="9" fill="#0c172a" stroke="#40506e"/><text x="750" y="387" font-size="16" fill="#fff">admin@example.org</text><text x="300" y="448" font-size="14" fill="#c4d2e5">HTTP challenge / redirect port</text><rect x="300" y="461" width="400" height="47" rx="9" fill="#0c172a" stroke="#40506e"/><text x="320" y="491" font-size="16" fill="#fff">80</text><text x="730" y="448" font-size="14" fill="#c4d2e5">HTTPS port</text><rect x="730" y="461" width="410" height="47" rx="9" fill="#0c172a" stroke="#40506e"/><text x="750" y="491" font-size="16" fill="#fff">443</text></g>
<rect x="300" y="535" width="840" height="82" rx="12" fill="#1b2945" stroke="#40506e"/><text x="326" y="568" font-family="Arial" font-size="15" font-weight="bold" fill="#fff">After saving</text><text x="326" y="594" font-family="Arial" font-size="13" fill="#a9b8d0">Restart the dashboard service: sudo systemctl restart frnadn</text>
<text x="600" y="708" font-family="Arial" font-size="11" text-anchor="middle" fill="#6f819f">UI preview · schematic illustration, not a live admin screenshot</text></svg>