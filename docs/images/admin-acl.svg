<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="930" viewBox="0 0 1280 930" role="img" aria-labelledby="title desc">
<title id="title">Schematische Vorschau der ACL-Verwaltung</title><desc id="desc">Admin-Portal mit Raumzugriffseinstellungen sowie Formularen für Admins, Mute-, Block- und Access-Liste.</desc>
<defs><style>
.bg{fill:#101820}.panel{fill:#19242e;stroke:#31414e;stroke-width:1}.room{fill:#151f28;stroke:#354653;stroke-width:1}.entry{fill:#202e39;stroke:#394d5b;stroke-width:1}.text{font:16px system-ui,sans-serif;fill:#ecf2f5}.muted{font:13px system-ui,sans-serif;fill:#a8bac5}.small{font:12px system-ui,sans-serif;fill:#dce6eb}.head{font:bold 23px system-ui,sans-serif;fill:#f2f6f8}.sect{font:bold 17px system-ui,sans-serif;fill:#f0f5f7}.field{fill:#101a22;stroke:#425663}.accent{fill:#3a9b83}.accenttxt{font:bold 13px system-ui,sans-serif;fill:white}.check{fill:#50b99a}.pill{fill:#304551}
</style></defs>
<rect class="bg" width="1280" height="930"/><rect class="panel" x="24" y="22" width="1232" height="886" rx="14"/>
<text class="head" x="54" y="70">🛡️ Server access lists</text><text class="muted" x="54" y="101">SQLite-Verwaltung · FRN XML wird synchronisiert · Änderungen benötigen einen Neustart</text>
<rect class="room" x="48" y="125" width="1184" height="754" rx="10"/><text class="head" x="72" y="164">🏠 ADN · net01</text>
<rect class="panel" x="70" y="183" width="1140" height="126" rx="8"/><text class="sect" x="90" y="212">Zugriffseinstellungen</text>
<rect class="check" x="92" y="229" width="17" height="17" rx="3"/><path d="m96 237 4 4 7-9" fill="none" stroke="#10221d" stroke-width="2"/><text class="small" x="118" y="243">Nur Stationen auf der Access-Liste zulassen</text>
<rect class="field" x="560" y="224" width="18" height="18" rx="3"/><text class="small" x="586" y="239">Sprechrecht erforderlich</text>
<text class="muted" x="90" y="278">Zugriffshinweis</text><rect class="field" x="207" y="258" width="760" height="34" rx="5"/><text class="small" x="220" y="280">Willkommen im ADN-Raum</text><rect class="accent" x="1050" y="257" width="135" height="37" rx="6"/><text class="accenttxt" x="1070" y="281">Einstellungen sichern</text>
